deployAs:
  - name: page-editor
    applicationType: merchant-center-custom-application
    configuration:
      standardConfiguration:
        - key: CUSTOM_APPLICATION_ID
          description: The Custom Application ID
          required: true
        - key: ENTRY_POINT_URI_PATH
          description: The Application entry point URI path
          required: true
          default: 'page-editor'
        - key: INITIAL_PROJECT_KEY
          description: development project key
          required: true
        - key: CLOUD_IDENTIFIER
          description: one of the following gcp-us, gcp-eu, aws-us, aws-eu
          required: true
          default: 'gcp-eu'
        - key: IMAGE_PICKER_BASE_URL
          description: contentools media service base URL including the /service path prefix; empty disables the image picker
          required: false
        - key: IMAGE_PICKER_BUSINESS_UNIT_KEY
          description: business unit key namespacing media storage
          required: false
          default: 'default'