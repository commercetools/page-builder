deployAs:
  - name: page-editor
    applicationType: merchant-center-custom-application
    configuration:
      standardConfiguration:
        # Merchant Center registration
        - key: CUSTOM_APPLICATION_ID
          description: The Custom Application ID
          required: true
        - key: ENTRY_POINT_URI_PATH
          description: The Application entry point URI path
          required: true
          default: 'page-editor'
        - key: CLOUD_IDENTIFIER
          description: one of the following gcp-us, gcp-eu, aws-us, aws-eu
          required: true
          default: 'gcp-eu'
        # Connection to the page-builder service (optional)
        - key: PAGE_BUILDER_SERVICE_URL
          description: page-builder service URL including its /service path [Use a dummy URL for the first deployment]; empty keeps the app on the Merchant Center GraphQL gateway and turns the image and video upload field off (uploads are stored by the service, see PB_MEDIA_BUCKET)
          required: false
        - key: PAGE_BUILDER_SERVICE_HOOKS
          description: all, or a comma list of hook families (pages, page-components, comments, workflows, page-workflow, preview-settings, data-sources, sections, components, instances, reset) that use the service; empty means none
          required: false
  - name: page-builder-service
    applicationType: service
    endpoint: /service
    configuration:
      standardConfiguration:
        # Who may call the service
        - key: PB_RENDER_ORIGINS
          description: comma-separated storefront server origins allowed to call the render API
          required: true
        - key: PB_EDITOR_ORIGINS
          description: comma-separated Merchant Center origins allowed to embed and drive the visual-editing bridge
          required: true
          default: 'https://mc.europe-west1.gcp.commercetools.com'
        - key: PB_MC_ISSUER
          description: Merchant Center API Gateway the MC app's JWTs come from, as a cloud identifier (gcp-eu, gcp-us, gcp-au, aws-eu, aws-us) or a URL; the JWT audience is this service's own public origin, taken from the CONNECT_SERVICE_URL that Connect provides; unset disables the Merchant Center admin API
          required: false
        # Media uploads (optional): the bucket the editor's image and video fields upload to
        - key: PB_MEDIA_BUCKET
          description: Google Cloud Storage bucket for uploaded media (uniform bucket-level access, with allUsers as Storage Object Viewer so pages can read the files); set together with PB_MEDIA_SERVICE_ACCOUNT_KEY_B64, or leave both empty to switch uploads off
          required: false
        - key: PB_MEDIA_PATH_PREFIX
          description: object key prefix inside the bucket, without leading or trailing slash
          required: false
          default: 'page-builder/media'
        - key: PB_MEDIA_MAX_BYTES
          description: largest accepted upload in bytes (1024 to 26214400)
          required: false
          default: '10485760'
        - key: PB_MEDIA_ALLOWED_TYPES
          description: comma-separated allowed upload content types, from image/jpeg, image/png, image/gif, image/webp, image/avif, video/mp4, video/webm, application/pdf; empty allows all of them
          required: false
        # Read cache and listing facets (optional)
        - key: PB_CACHE_TTL_SECONDS
          description: seconds to cache commercetools reads; preview and draft reads are never cached; 0 disables the cache
          required: false
          default: '15'
        - key: PB_FACET_ATTRIBUTES
          description: comma-separated product attribute names to offer as facets, in order; empty derives them from the searchable enum/text/boolean attributes of the product types
          required: false
        - key: PB_FACET_LIMIT
          description: maximum number of derived facets when PB_FACET_ATTRIBUTES is empty
          required: false
          default: '8'
        # Operations (optional)
        - key: LOG_LEVEL
          description: one of debug, info, warn, error
          required: false
          default: 'info'
      securedConfiguration:
        - key: PB_RENDER_KEY
          description: key the storefront shim presents on render calls
          required: true
        - key: PB_PREVIEW_TOKEN
          description: token that unlocks draft/preview and edit mode; leave unset to disable previews
          required: false
        - key: PB_ADMIN_SECRET
          description: bearer secret for catalog validate, push and publish from CI
          required: true
        - key: PB_MEDIA_SERVICE_ACCOUNT_KEY_B64
          description: service-account JSON key for PB_MEDIA_BUCKET, base64 on one line (Storage Object Creator and Viewer); leave empty to switch uploads off
          required: false
inheritAs:
  # Connect generates the API client at install time with exactly these scopes and injects
  # CTP_PROJECT_KEY, CTP_CLIENT_ID, CTP_CLIENT_SECRET, CTP_SCOPE, CTP_API_URL and CTP_AUTH_URL
  # into the page-builder-service; no credentials are configured by hand.
  apiClient:
    scopes:
      - manage_key_value_documents # page, catalog and settings custom objects (read + write)
      - view_products # product search, projections, product types
      - view_categories
      - view_stores
